[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  VITE_WINGS_DEPLOY_CONTEXT = "production"
  VITE_WINGS_DATA_MODE = "production"

[context.deploy-preview.environment]
  VITE_WINGS_DEPLOY_CONTEXT = "deploy-preview"
  VITE_WINGS_DATA_MODE = "aggregate-only"

[context.branch-deploy.environment]
  VITE_WINGS_DEPLOY_CONTEXT = "branch-deploy"
  VITE_WINGS_DATA_MODE = "aggregate-only"

[context.staging.environment]
  VITE_WINGS_DEPLOY_CONTEXT = "staging"
  VITE_WINGS_DATA_MODE = "aggregate-only"

[context.dev.environment]
  VITE_WINGS_DEPLOY_CONTEXT = "dev"
  VITE_WINGS_DATA_MODE = "synthetic-only"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"
    # Safe default before auth: full HTML refetch on every navigation. After login,
    # consider private, no-cache for shell revalidation instead of no-store.
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Overrides Cache-Control only; other /* headers (CSP, noindex, etc.) still apply.
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
